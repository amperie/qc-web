<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Q - Quantitative Intelligence</title>
    <meta
      name="description"
      content="A quantitative intelligence platform that turns scattered market information and backtests into conviction."
    />
    <link rel="icon" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <canvas class="signal-field" aria-hidden="true"></canvas>
      <div class="shade" aria-hidden="true"></div>

      <header class="topbar">
        <a class="mark" href="/" aria-label="Quant Crucible home">
          <span class="mark-symbol">Q</span>
          <span>Quant Crucible</span>
        </a>
        <a class="contact-link" href="mailto:hello@quant-crucible.com">Contact us</a>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <div class="copy">
          <h1 id="hero-title">The edge is getting sharper.</h1>
          <p class="lede">
            We're building a quantitative intelligence platform that turns scattered market information
            and backtests into conviction. Put your strategies through the crucible.
          </p>
          <div class="actions">
            <a class="button primary" href="mailto:hello@quant-crucible.com">Private beta in formation</a>
            <a class="button secondary" href="mailto:hello@quant-crucible.com">Contact us</a>
          </div>
        </div>

        <div class="logo-wrap" aria-hidden="true">
          <img src="/assets/quant-crucible-logo.png" alt="" />
        </div>
      </section>

      <footer class="footer">
        <span>Q / Quantitative Intelligence</span>
        <span>&copy; 2026</span>
      </footer>
    </main>

    <script src="/signal-field.js"></script>
  </body>
</html>
